name: Native macOS ARM64 acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/macos-arm64-acceptance.yml"
      - "bin/**"
      - "config/**"
      - "controller/**"
      - "integrations/**"
      - "lib/**"
      - "tests/**"
      - "discover-models.sh"
      - "doctor.sh"
      - "install.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-arm64-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: macOS ARM64 acceptance
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Prepare native runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          command -v jq >/dev/null || brew install jq
          command -v rg >/dev/null || brew install ripgrep
          sudo npm install --global @anthropic-ai/claude-code
          export ORICHUM_DATA_HOME="$RUNNER_TEMP/orichum-data"
          export ORICHUM_CONFIG_HOME="$RUNNER_TEMP/orichum-config"
          export USER_BIN_DIR="$RUNNER_TEMP/orichum-bin"
          export UV_TOOL_DIR="$RUNNER_TEMP/uv-tools"
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/orichum-bin"
          printf '%s\n' \
            "ORICHUM_DATA_HOME=$ORICHUM_DATA_HOME" \
            "ORICHUM_CONFIG_HOME=$ORICHUM_CONFIG_HOME" \
            "USER_BIN_DIR=$USER_BIN_DIR" \
            "UV_TOOL_DIR=$UV_TOOL_DIR" \
            "UV_TOOL_BIN_DIR=$UV_TOOL_BIN_DIR" >>"$GITHUB_ENV"
          printf '%s\n' "$USER_BIN_DIR" >>"$GITHUB_PATH"
          claude --version
          uv --version

      - name: Run repository test suites
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py'
          for test_script in \
              tests/test_smoke.sh \
              tests/test_plugins.sh \
              tests/test_installer.sh \
              tests/test_install_transaction.sh \
              tests/test_live_stack_routes.sh; do
            if ! bash "$test_script"; then
              printf '::error title=Shell contract failed::%s failed; diagnostic rerun follows\n' \
                "$test_script"
              bash -x "$test_script"
              exit 1
            fi
          done

      - name: Fresh install without providers
        shell: bash
        run: |
          set -euo pipefail
          report_acceptance_failure() {
            local status="$?"
            printf '::error title=Native acceptance failure::line %s exited %s: %s\n' \
              "${BASH_LINENO[0]:-$LINENO}" "$status" "$BASH_COMMAND"
            exit "$status"
          }
          trap report_acceptance_failure ERR
          ./install.sh
          managed_python="$ORICHUM_DATA_HOME/bin/orichum-python"
          test -x "$managed_python"
          "$managed_python" -I -B -c '
          import platform, sys
          assert platform.python_implementation() == "CPython"
          assert sys.version_info[:2] == (3, 14)
          '
          jq -e '
            keys == [
              "claudexProxyPort",
              "cliproxyPort",
              "headroomPort",
              "routeProxyPort"
            ] and
            ([.[]] | unique | length) == 4
          ' "$ORICHUM_DATA_HOME/service-ports.json" >/dev/null
          launchctl print "gui/$(id -u)/io.orichum.cliproxy" >/dev/null
          headroom_service="$(
            launchctl print "gui/$(id -u)/io.orichum.headroom"
          )"
          rg -Fq -- '--disable-kompress' <<<"$headroom_service"
          if launchctl print "gui/$(id -u)/io.orichum.route-proxy" \
              >/dev/null 2>&1; then
            printf 'route proxy unexpectedly active without providers\n' >&2
            exit 1
          fi
          cliproxy_port="$(jq -r .cliproxyPort "$ORICHUM_DATA_HOME/service-ports.json")"
          headroom_port="$(jq -r .headroomPort "$ORICHUM_DATA_HOME/service-ports.json")"
          curl -fsS "http://127.0.0.1:$cliproxy_port/v1/models" |
            jq -e '.data | type == "array"' >/dev/null
          headroom_health="$RUNNER_TEMP/headroom-provider-pending.json"
          headroom_status="$(
            curl -sS --output "$headroom_health" \
              --write-out '%{http_code}' \
              "http://127.0.0.1:$headroom_port/health"
          )"
          test "$headroom_status" = 200
          jq -e '
            .service == "headroom-proxy" and
            .status == "unhealthy" and
            .ready == false
          ' "$headroom_health" >/dev/null
          trap - ERR
          set +e
          poison_bin="$RUNNER_TEMP/poison-python"
          mkdir -p "$poison_bin"
          printf '#!/bin/sh\nexit 99\n' >"$poison_bin/python3"
          chmod +x "$poison_bin/python3"
          doctor_output="$(
            PATH="$poison_bin:$USER_BIN_DIR:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
              orichum doctor 2>&1
          )"
          doctor_rc=$?
          set -e
          trap report_acceptance_failure ERR
          printf '%s\n' "$doctor_output"
          test "$doctor_rc" -eq 1
          test "$(grep -c '^FAIL ' <<<"$doctor_output")" -eq 1
          grep -Fq 'provider login is pending' <<<"$doctor_output"

      - name: Activate disposable multi-family routes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - "$ORICHUM_DATA_HOME/auth" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          auth = Path(sys.argv[1])
          auth.mkdir(mode=0o700, parents=True, exist_ok=True)
          for name, provider in (
              ("codex-macos-arm64.json", "codex"),
              ("claude-macos-arm64.json", "claude"),
          ):
              target = auth / name
              target.write_text(
                  json.dumps(
                      {
                          "type": provider,
                          "email": "macos-arm64-acceptance@example.invalid",
                          "access_token": "acceptance-placeholder-not-a-secret",
                          "refresh_token": "acceptance-placeholder-not-a-secret",
                          "disabled": False,
                      }
                  ),
                  encoding="utf-8",
              )
              os.chmod(target, 0o600)
          PY
          orichum provider account add \
            "macOS ARM64 GPT" openai codex-macos-arm64.json shared \
            --priority primary
          orichum provider account add \
            "macOS ARM64 Claude" anthropic claude-macos-arm64.json shared \
            --priority primary
          ./install.sh
          jq -e '
            keys == [
              "claudexProxyPort",
              "cliproxyPort",
              "headroomPort",
              "routeProxyPort"
            ] and
            ([.[]] | unique | length) == 4
          ' "$ORICHUM_DATA_HOME/service-ports.json" >/dev/null
          launchctl print "gui/$(id -u)/io.orichum.cliproxy" >/dev/null
          launchctl print "gui/$(id -u)/io.orichum.headroom" >/dev/null
          launchctl print "gui/$(id -u)/io.orichum.route-proxy" >/dev/null
          launchctl print "gui/$(id -u)/io.orichum.route-proxy" |
            rg -Fq "$ORICHUM_DATA_HOME/bin/orichum-route-proxy"
          route_port="$(jq -r .routeProxyPort "$ORICHUM_DATA_HOME/service-ports.json")"
          curl -fsS "http://127.0.0.1:$route_port/health" |
            jq -e '
              .service == "orichum-route-proxy" and .ready == true
            ' >/dev/null
          curl -fsS "http://127.0.0.1:$route_port/v1/models" |
            jq -e '
              [.data[].id] as $ids |
              ($ids | index("gpt-5.6-sol")) != null and
              ($ids | index("gpt-5.6-terra")) != null and
              ($ids | index("claude-sonnet-5")) != null and
              ($ids | index("claude-opus-4-8")) != null
            ' >/dev/null
          headroom_port="$(jq -r .headroomPort "$ORICHUM_DATA_HOME/service-ports.json")"
          curl -fsS "http://127.0.0.1:$headroom_port/health" |
            jq -e '
              .service == "headroom-proxy" and
              .status == "healthy" and
              .ready == true and
              .checks.kompress.enabled == false
            ' >/dev/null
          orichum doctor

      - name: Verify central repository graph lifecycle
        shell: bash
        run: |
          set -euo pipefail
          graph_project="$RUNNER_TEMP/graph-acceptance"
          graph_palace="$RUNNER_TEMP/graph-acceptance-palace"
          install -d -m 0700 "$graph_project" "$graph_palace"
          git -C "$graph_project" init -q
          git -C "$graph_project" remote add origin \
            https://example.invalid/orichum/graph-acceptance.git
          printf 'def acceptance():\n    return "central"\n' \
            >"$graph_project/acceptance.py"
          git -C "$graph_project" add acceptance.py
          git -C "$graph_project" \
            -c user.name=acceptance \
            -c user.email=acceptance@example.invalid \
            commit -q -m initial
          python3 - \
            "$ORICHUM_CONFIG_HOME/projects.json" \
            "$graph_project" "$graph_palace" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          document = json.loads(path.read_text(encoding="utf-8"))
          document["contexts"].append(
              {
                  "root": sys.argv[2],
                  "dockerProfile": None,
                  "modelStack": "balanced",
                  "accountPools": ["shared"],
                  "memoryPalace": sys.argv[3],
                  "memoryWing": "graph-acceptance",
              }
          )
          temporary = path.with_name(f".{path.name}.acceptance")
          temporary.write_text(
              json.dumps(document, indent=2) + "\n",
              encoding="utf-8",
          )
          os.chmod(temporary, 0o600)
          os.replace(temporary, path)
          PY
          orichum graph "$graph_project"
          test ! -e "$graph_project/graphify-out"
          orichum graph status "$graph_project" |
            tee "$RUNNER_TEMP/graph-status.log"
          rg -Fq 'current' "$RUNNER_TEMP/graph-status.log"
          test "$(find "$ORICHUM_DATA_HOME/graphs" -name graph.json \
            -type f | wc -l)" -ge 1

          cat >"$RUNNER_TEMP/run-graph-session-fixture" <<'FIXTURE'
          #!/usr/bin/env bash
          set -euo pipefail
          graph_project="$1"
          marker="$2"
          claudex="$ORICHUM_DATA_HOME/bin/claudex"
          real_claudex="$ORICHUM_DATA_HOME/bin/.claudex-graph-acceptance"
          mv "$claudex" "$real_claudex"
          restore_claudex() {
            rm -f -- "$claudex"
            mv "$real_claudex" "$claudex"
          }
          trap restore_claudex EXIT
          cat >"$claudex" <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$#" -eq 1 && "$1" == --version ]]; then
            exec "$ACCEPTANCE_REAL_CLAUDEX" "$@"
          fi
          graphify_command="$(
            PYTHONDONTWRITEBYTECODE=1 "$ORICHUM_PYTHON" -I -B - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          from pathlib import Path
          import stat

          def fail(message):
              raise SystemExit(message)

          def same_file(left, right):
              return (
                  left.st_dev == right.st_dev
                  and left.st_ino == right.st_ino
                  and left.st_mode == right.st_mode
                  and left.st_size == right.st_size
                  and left.st_mtime_ns == right.st_mtime_ns
              )

          def open_private_file(path):
              before = os.stat(path, follow_symlinks=False)
              if (
                  stat.S_ISLNK(before.st_mode)
                  or not stat.S_ISREG(before.st_mode)
                  or before.st_uid != os.getuid()
                  or stat.S_IMODE(before.st_mode) != 0o600
              ):
                  fail(f"unsafe session file: {path}")
              flags = (
                  os.O_RDONLY
                  | getattr(os, "O_CLOEXEC", 0)
                  | getattr(os, "O_NOFOLLOW", 0)
                  | getattr(os, "O_NONBLOCK", 0)
              )
              descriptor = os.open(path, flags)
              opened = os.fstat(descriptor)
              after = os.stat(path, follow_symlinks=False)
              if not same_file(before, opened) or not same_file(opened, after):
                  os.close(descriptor)
                  fail(f"session file changed during validation: {path}")
              return descriptor, opened

          def load_private_json(path):
              descriptor, opened = open_private_file(path)
              if opened.st_size > 4 * 1024 * 1024:
                  os.close(descriptor)
                  fail(f"session JSON is unexpectedly large: {path}")
              with os.fdopen(descriptor, encoding="utf-8") as stream:
                  document = json.load(stream)
                  final = os.fstat(stream.fileno())
              after = os.stat(path, follow_symlinks=False)
              if not same_file(opened, final) or not same_file(final, after):
                  fail(f"session file changed during read: {path}")
              return document

          data_home = Path(os.environ["ORICHUM_DATA_HOME"])
          resolved_data_home = data_home.resolve(strict=True)
          mcp_config = Path(os.environ["CLAUDEX_MCP_CONFIG"])
          sessions = data_home / "state" / "sessions"
          run_dir = mcp_config.parent
          if (
              not mcp_config.is_absolute()
              or mcp_config != run_dir / "mcp.json"
              or run_dir.parent != sessions
              or not run_dir.name.startswith("run.")
              or run_dir.name == "run."
              or run_dir.resolve(strict=True)
              != resolved_data_home / "state" / "sessions" / run_dir.name
          ):
              fail("CLAUDEX_MCP_CONFIG is not a physical run mcp.json")
          run_stat = os.stat(run_dir, follow_symlinks=False)
          if (
              not stat.S_ISDIR(run_stat.st_mode)
              or run_stat.st_uid != os.getuid()
              or stat.S_IMODE(run_stat.st_mode) != 0o700
          ):
              fail("physical run directory is not private")

          snapshot = run_dir / "graph.json"
          context_file = run_dir / "context.json"
          mcp = load_private_json(mcp_config)
          context = load_private_json(context_file)
          try:
              graphify = mcp["mcpServers"]["graphify"]
              graph = context["graph"]
              graphify_command = graphify["command"]
              graphify_args = graphify["args"]
              context_snapshot = Path(graph["graphFile"])
              central = Path(graph["centralGraphFile"]).resolve(strict=True)
              expected_digest = graph["sha256"]
          except (KeyError, TypeError, ValueError) as error:
              fail(f"invalid physical graph session metadata: {error}")
          if (
              not isinstance(graphify_command, str)
              or not graphify_command.endswith("/graphify-mcp")
              or not os.access(graphify_command, os.X_OK)
              or graphify_args != ["--graph", str(snapshot)]
              or context_snapshot != snapshot
              or not isinstance(expected_digest, str)
          ):
              fail("physical graph session binding is inconsistent")
          central_root = (data_home / "graphs").resolve(strict=True)
          if not central.is_file():
              fail("central graph provenance is not a file")
          try:
              central.relative_to(central_root)
          except ValueError:
              fail("central graph provenance escapes central graph storage")

          graph_fd, opened = open_private_file(snapshot)
          digest = hashlib.sha256()
          try:
              while True:
                  chunk = os.read(graph_fd, 1024 * 1024)
                  if not chunk:
                      break
                  digest.update(chunk)
              final = os.fstat(graph_fd)
          finally:
              os.close(graph_fd)
          after = os.stat(snapshot, follow_symlinks=False)
          if (
              not same_file(opened, final)
              or not same_file(final, after)
              or not hmac.compare_digest(digest.hexdigest(), expected_digest)
          ):
              fail("physical graph snapshot digest mismatch")
          print(graphify_command)
          PY
          )"
          graph_file="${CLAUDEX_MCP_CONFIG%/mcp.json}/graph.json"
          PYTHONDONTWRITEBYTECODE=1 "$ORICHUM_PYTHON" -I -B \
            "$CLAUDEX_WORKFLOW_ROOT/integrations/common/mcp_probe.py" \
            --timeout 10 \
            --require-tool query_graph \
            --require-tool graph_stats \
            -- "$graphify_command" --graph "$graph_file"
          : >"$ACCEPTANCE_SESSION_MARKER"
          WRAPPER
          chmod 0755 "$claudex"
          (
            cd "$graph_project"
            ACCEPTANCE_REAL_CLAUDEX="$real_claudex" \
            ACCEPTANCE_SESSION_MARKER="$marker" \
              orichum run -- -p "central graph acceptance"
          )
          test -f "$marker"
          FIXTURE
          chmod 0755 "$RUNNER_TEMP/run-graph-session-fixture"
          "$RUNNER_TEMP/run-graph-session-fixture" \
            "$graph_project" "$RUNNER_TEMP/graph-session.initial"

      - name: Verify idempotent upgrade
        shell: bash
        run: |
          set -euo pipefail
          before_ports="$(jq -cS . "$ORICHUM_DATA_HOME/service-ports.json")"
          before_route_pid="$(
            launchctl print "gui/$(id -u)/io.orichum.route-proxy" |
              awk '/^[[:space:]]*pid = / { print $3; exit }'
          )"
          before_python_target="$(readlink "$ORICHUM_DATA_HOME/bin/orichum-python")"
          ./install.sh | tee "$RUNNER_TEMP/orichum-upgrade.log"
          after_ports="$(jq -cS . "$ORICHUM_DATA_HOME/service-ports.json")"
          test "$before_ports" = "$after_ports"
          test "$before_route_pid" = "$(
            launchctl print "gui/$(id -u)/io.orichum.route-proxy" |
              awk '/^[[:space:]]*pid = / { print $3; exit }'
          )"
          test "$before_python_target" = "$(
            readlink "$ORICHUM_DATA_HOME/bin/orichum-python"
          )"
          grep -Fq 'Python action:  reused' "$RUNNER_TEMP/orichum-upgrade.log"
          grep -Fq 'CLIProxyAPI: reused' "$RUNNER_TEMP/orichum-upgrade.log"
          grep -Fq 'Headroom:    reused' "$RUNNER_TEMP/orichum-upgrade.log"
          grep -Fq 'Route proxy: reused' "$RUNNER_TEMP/orichum-upgrade.log"
          graph_project="$RUNNER_TEMP/graph-acceptance"
          orichum graph "$graph_project"
          test ! -e "$graph_project/graphify-out"
          orichum graph status "$graph_project" |
            tee "$RUNNER_TEMP/graph-status.upgrade.log"
          rg -Fq 'current' "$RUNNER_TEMP/graph-status.upgrade.log"
          "$RUNNER_TEMP/run-graph-session-fixture" \
            "$graph_project" "$RUNNER_TEMP/graph-session.upgrade"
          orichum doctor

      - name: Print bounded diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          for label in \
              io.orichum.cliproxy \
              io.orichum.headroom \
              io.orichum.route-proxy; do
            launchctl print "gui/$(id -u)/$label"
          done
          if [[ -d "$ORICHUM_DATA_HOME/logs" ]]; then
            for log_file in "$ORICHUM_DATA_HOME"/logs/*; do
              [[ -f "$log_file" ]] && tail -n 80 "$log_file"
            done
          fi
          ports_file="$ORICHUM_DATA_HOME/service-ports.json"
          if [[ -f "$ports_file" ]]; then
            jq '{
              preferredClaudexProxyPort: .claudexProxyPort,
              cliproxyPort,
              headroomPort,
              routeProxyPort
            }' "$ports_file"
            for field_and_path in \
                'cliproxyPort /v1/models' \
                'headroomPort /health' \
                'routeProxyPort /v1/models'; do
              read -r field endpoint <<<"$field_and_path"
              port="$(jq -r --arg field "$field" '.[$field]' "$ports_file")"
              curl -fsS --max-time 3 "http://127.0.0.1:$port$endpoint" |
                jq '{service, status, ready, object, modelCount: (.data | length)}'
            done
          fi

      - name: Clean up launch agents
        if: always()
        shell: bash
        run: |
          set +e
          for label in \
              io.orichum.route-proxy \
              io.orichum.headroom \
              io.orichum.cliproxy; do
            launchctl bootout "gui/$(id -u)/$label" >/dev/null 2>&1 || true
          done
